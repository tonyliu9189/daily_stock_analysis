name: 排程觸發診斷（短期測試）

# 只測試排程事件是否到達，不安裝依賴、不呼叫 AI、不發送通知。
# cron 不支援年份；下方期限防止未來年度執行診斷步驟。
# 完成這三次觀察後，可刪除此檔案；每日股票分析排程不受影響。
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 6 10 *'
    - cron: '33 15 6 10 *'
    - cron: '43 15 6 10 *'

permissions:
  contents: read

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 記錄觸發來源與時間
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TEST_EXPIRES_AT: '2026-10-06T17:43:00Z'
        run: |
          if [ "$(date -u +%s)" -gt "$(date -u -d "$TEST_EXPIRES_AT" +%s)" ]; then
            echo "Diagnostic window expired; remove this temporary workflow."
            exit 0
          fi
          printf 'event=%s\nschedule=%s\n' "$TRIGGER_EVENT" "$TRIGGER_SCHEDULE"
          date -u '+UTC: %Y-%m-%d %H:%M:%S'
          TZ=Asia/Taipei date '+Taiwan: %Y-%m-%d %H:%M:%S'